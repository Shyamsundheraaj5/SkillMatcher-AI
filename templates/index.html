<!DOCTYPE html>
<html lang="en">

<head>
  <!-- Basic -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <!-- Mobile Metas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <!-- Site Metas -->
  <meta name="keywords" content="" />
  <meta name="description" content="" />
  <meta name="author" content="" />
  <link rel="stylesheet" href="/static/style.css">

  <title>SkillMatcher</title>

  <link href="https://fonts.googleapis.com/css?family=Poppins:400,700&display=swap" rel="stylesheet">
</head>

<body class="sub_page">
    <div class="hero_area">
        <header class="header_section">
            <div class="container-fluid">
                <nav class="navbar navbar-expand-lg custom_nav-container">
                    <a class="navbar-brand" href="/">
                        <span>SkillMatcher</span>
                    </a>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav">
                            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="/about">About</a></li>
                            <li class="nav-item"><a class="nav-link" href="/work">Work</a></li>
                            <li class="nav-item active"><a class="nav-link" href="/logout">Logout</a></li>
                        </ul>
                    </div>
                </nav>
            </div>
        </header>
    </div>
    

  <!-- category section -->
  <h1>ATS Resume Expert</h1>

  <form method="POST" enctype="multipart/form-data">
    <label for="job_description">Job Description:</label>
    <textarea id="job_description" name="job_description" required></textarea>

    <label for="resume_files">Upload Resumes:</label>
    <input type="file" id="resume_files" name="resume_files" multiple required>

    <label for="task">Select Task:</label>
    <select id="task" name="task" required>
        <option value="percentage_match">Percentage Match</option>
    </select>

    <button type="submit">Submit</button>
</form>

{% if response %}
    <h2>Analysis Results:</h2>
    {% for res in response %}
        <div class="response">
            {{ res|safe }}
        </div>
    {% endfor %}
{% endif %}






</body>

</html>
